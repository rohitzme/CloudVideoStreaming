<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>

<body>

    <h2>Cloud Video Streaming - Admin Dashboard</h2>

    <h3>System Overview</h3>

    <p>Total Users: <span id="users">100</span></p>
    <p>Total Videos: <span id="videos">25</span></p>
    <p>Active Streams: <span id="streams">8</span></p>

    <h3>Admin Controls</h3>

    <button onclick="manageUsers()">Manage Users</button>
    <button onclick="manageVideos()">Manage Videos</button>

    <p id="message"></p>

    <script>
        function manageUsers() {
            document.getElementById("message").innerHTML =
                "User management opened.";
        }

        function manageVideos() {
            document.getElementById("message").innerHTML =
                "Video management opened.";
        }
    </script>

</body>
</html>
