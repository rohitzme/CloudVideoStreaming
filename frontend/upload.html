<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video | Cloud Video Streaming</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="admin.html">Cloud<span>Stream</span></a>
        <nav class="nav">
            <a href="admin.html">Dashboard</a>
            <a class="active" href="upload.html">Upload</a>
            <a href="stream.html">Stream</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <span class="badge">● Upload Center</span>
            <h1>Upload a Video</h1>
            <p>Select a video, validate it, preview it, and simulate the upload workflow.</p>
        </section>

        <section class="panel">
            <div class="form-group">
                <label for="video">Video file</label>
                <input type="file" id="video" accept="video/*">
                <p id="fileInfo" class="muted">Supported video files up to 100 MB.</p>
            </div>

            <div id="previewBox" class="video-box" style="display:none;">
                <video id="preview" controls></video>
            </div>

            <div class="actions">
                <button class="btn" id="uploadBtn" disabled>Start Upload</button>
                <button class="btn secondary" id="clearBtn" type="button">Clear</button>
            </div>

            <div class="progress"><div id="progressBar"></div></div>
            <p id="message" class="message"></p>
        </section>
    </main>

    <script>
        const fileInput = document.getElementById('video');
        const uploadBtn = document.getElementById('uploadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const preview = document.getElementById('preview');
        const previewBox = document.getElementById('previewBox');
        const fileInfo = document.getElementById('fileInfo');
        const message = document.getElementById('message');
        const progressBar = document.getElementById('progressBar');
        let selectedFile = null;
        let objectUrl = null;

        fileInput.addEventListener('change', () => {
            selectedFile = fileInput.files[0];
            progressBar.style.width = '0%';
            message.textContent = '';
            if (!selectedFile) {
                uploadBtn.disabled = true;
                return;
            }

            const maxSize = 100 * 1024 * 1024;
            if (!selectedFile.type.startsWith('video/')) {
                message.textContent = 'Please select a valid video file.';
                message.className = 'message error';
                uploadBtn.disabled = true;
                return;
            }
            if (selectedFile.size > maxSize) {
                message.textContent = 'File is larger than the 100 MB demo limit.';
                message.className = 'message error';
                uploadBtn.disabled = true;
                return;
            }

            fileInfo.textContent = `${selectedFile.name} • ${(selectedFile.size / 1024 / 1024).toFixed(2)} MB`;
            if (objectUrl) URL.revokeObjectURL(objectUrl);
            objectUrl = URL.createObjectURL(selectedFile);
            preview.src = objectUrl;
            previewBox.style.display = 'block';
            uploadBtn.disabled = false;
            message.textContent = 'Video selected and ready for upload.';
            message.className = 'message';
        });

        uploadBtn.addEventListener('click', () => {
            if (!selectedFile) return;
            uploadBtn.disabled = true;
            clearBtn.disabled = true;
            message.textContent = 'Uploading video...';
            message.className = 'message';
            let progress = 0;
            const timer = setInterval(() => {
                progress += 10;
                progressBar.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(timer);
                    message.textContent = 'Upload completed successfully (frontend demo).';
                    uploadBtn.disabled = false;
                    clearBtn.disabled = false;
                }
            }, 120);
        });

        clearBtn.addEventListener('click', () => {
            fileInput.value = '';
            selectedFile = null;
            uploadBtn.disabled = true;
            preview.pause();
            preview.removeAttribute('src');
            preview.load();
            previewBox.style.display = 'none';
            progressBar.style.width = '0%';
            fileInfo.textContent = 'Supported video files up to 100 MB.';
            message.textContent = 'Selection cleared.';
            message.className = 'message';
        });
    </script>
</body>
</html>
