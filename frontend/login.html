<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CloudStream enterprise video streaming platform login">
    <title>Secure Login | CloudStream</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container narrow login-shell">
        <section class="panel login-panel">
            <div class="hero">
                <span class="badge">● Cloud Platform</span>
                <h1>CloudStream</h1>
                <p>Secure enterprise video streaming with role-based access, upload management and HTTP range streaming.</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <label class="check-row"><input type="checkbox" id="remember"> Remember this session</label>
                <div class="actions">
                    <button class="btn" type="submit" id="loginBtn">Sign in</button>
                    <button class="btn secondary" type="button" id="demoBtn">Use Admin Demo</button>
                </div>
                <p id="message" class="message"></p>
            </form>
            <div class="demo-card">
                <strong>Demo access</strong>
                <span>admin / admin123</span>
                <span>viewer / viewer123</span>
            </div>
        </section>
        <p class="footer">Cloud-Native Distributed Enterprise Video Streaming Platform · Sprint 5 Cloud Deployment</p>
    </main>
    <script src="app.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        if (getToken()) {
            const user = getStoredUser();
            if (user) location.href = user.role === 'admin' ? 'admin.html' : 'stream.html';
        }

        document.getElementById('demoBtn').addEventListener('click', () => {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
            message.textContent = 'Demo credentials filled. Click Sign in.';
            message.className = 'message';
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            message.textContent = '';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            try {
                const result = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                saveSession(result, document.getElementById('remember').checked);
                message.textContent = 'Authentication successful. Opening workspace...';
                setTimeout(() => location.href = result.user.role === 'admin' ? 'admin.html' : 'stream.html', 300);
            } catch (error) {
                message.textContent = error.message;
                message.className = 'message error';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
