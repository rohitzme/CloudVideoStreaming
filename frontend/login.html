<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | Cloud Video Streaming</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container narrow">
        <section class="panel">
            <div class="hero">
                <span class="badge">● Cloud Platform</span>
                <h1>Video Streaming Platform</h1>
                <p>Secure access to upload, stream and manage enterprise video content.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimum 6 characters" autocomplete="current-password">
                </div>

                <label style="display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:400;">
                    <input type="checkbox" id="remember" style="width:auto;"> Remember this session
                </label>

                <div class="actions">
                    <button class="btn" type="submit">Sign in</button>
                    <button class="btn secondary" type="button" id="demoBtn">Use Demo</button>
                </div>
                <p id="message" class="message"></p>
            </form>
        </section>

        <p class="footer">Cloud-Native Distributed Enterprise Video Streaming Platform</p>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');

        document.getElementById('demoBtn').addEventListener('click', () => {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
            message.textContent = 'Demo credentials filled. Click Sign in.';
            message.className = 'message';
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                message.textContent = 'Username and password are required.';
                message.className = 'message error';
                return;
            }
            if (password.length < 6) {
                message.textContent = 'Password must contain at least 6 characters.';
                message.className = 'message error';
                return;
            }

            const session = { username, loggedInAt: new Date().toISOString() };
            sessionStorage.setItem('cves_session', JSON.stringify(session));
            if (document.getElementById('remember').checked) {
                localStorage.setItem('cves_user', username);
            }

            message.textContent = 'Login successful. Opening dashboard...';
            message.className = 'message';
            setTimeout(() => { window.location.href = 'admin.html'; }, 500);
        });

        const savedUser = localStorage.getItem('cves_user');
        if (savedUser) document.getElementById('username').value = savedUser;
    </script>
</body>
</html>
